# Gera o servidor do Catwatch para Windows (catwatch-server.exe) numa máquina Windows,
# testa o executável e publica o .zip.
#   - Manual: aba Actions → "Servidor para Windows" → Run workflow (o .zip fica nos artefatos).
#   - Release: git tag server-v1.2.0 && git push --tags (o .zip vai para a página de releases).
name: Servidor para Windows

on:
  workflow_dispatch:
  push:
    tags: ["server-v*"]

permissions:
  contents: write   # para criar a release nas tags

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências (PyTorch só de CPU, bem menor que o de placa de vídeo)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyinstaller

      - name: Modelos embutidos (YOLO e ResNet50)
        run: python deploy/windows/prepare_models.py

      - name: Empacotar
        run: pyinstaller --noconfirm --log-level WARN deploy/windows/catwatch-server.spec

      - name: Testar o executável
        run: |
          $exe = "dist/catwatch-server/catwatch-server.exe"
          $data = Join-Path $env:RUNNER_TEMP "catwatch-data"
          $base = "http://127.0.0.1:8765"
          $p = Start-Process -FilePath $exe -ArgumentList "--data-dir", $data, "--port", "8765" -PassThru `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          # Qualquer falha daqui em diante mostra o que o servidor escreveu.
          trap { Get-Content out.txt, err.txt -ErrorAction SilentlyContinue; break }
          $up = $false
          for ($i = 0; $i -lt 180 -and -not $p.HasExited; $i++) {
            try { if ((Invoke-RestMethod "$base/api/info").app -eq "catwatch") { $up = $true; break } } catch {}
            Start-Sleep 1
          }
          if (-not $up) { Get-Content out.txt, err.txt -ErrorAction SilentlyContinue; throw "o servidor não respondeu" }
          $h = @{ "X-Token" = (Get-Content (Join-Path $data "data/token.txt")).Trim() }

          # Painel web (arquivos estáticos embutidos)
          if ((Invoke-WebRequest "$base/" -UseBasicParsing).StatusCode -ne 200) { throw "painel web" }

          # Detecção: uma imagem enviada como câmera precisa ser analisada pelo YOLO
          $img = python -c "import ultralytics, os; print(os.path.join(os.path.dirname(ultralytics.__file__), 'assets', 'bus.jpg'))"
          for ($i = 0; $i -lt 5; $i++) { Invoke-RestMethod -Method Post "$base/api/push/teste" -Headers $h -InFile $img -ContentType "image/jpeg" | Out-Null; Start-Sleep 1 }
          $st = Invoke-RestMethod "$base/api/status" -Headers $h
          $st | ConvertTo-Json
          if ($st.frames_analyzed -lt 1) { throw "nenhum quadro analisado" }

          # Identificação: cadastrar uma foto passa pela ResNet50
          $r = Invoke-RestMethod -Method Post "$base/api/cats/Teste/photos" -Headers $h -Form @{ photo = Get-Item $img }
          if ($r.photos -ne 1) { throw "cadastro de foto" }

          # Encerramento limpo pela API (o app de PC usa para parar e reiniciar)
          Invoke-RestMethod -Method Post "$base/api/shutdown" -Headers $h | Out-Null
          if (-not $p.WaitForExit(30000)) { Stop-Process $p -Force; throw "não encerrou pelo /api/shutdown" }
          Get-Content out.txt, err.txt -ErrorAction SilentlyContinue
          "executável ok"

      - name: Compactar
        run: |
          Copy-Item deploy/windows/LEIA-ME.txt dist/catwatch-server/
          Compress-Archive -Path dist/catwatch-server -DestinationPath catwatch-server-windows.zip
          "{0:N0} MB" -f ((Get-Item catwatch-server-windows.zip).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: catwatch-server-windows
          path: server/catwatch-server-windows.zip

      - name: Publicar na página de releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME catwatch-server-windows.zip `
            --title "Servidor $env:GITHUB_REF_NAME para Windows" `
            --notes "Extraia o .zip e abra catwatch-server.exe. Veja LEIA-ME.txt dentro do .zip."
